name: Deploy Kyutai Pocket TTS Voice Studio
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site and pin tokenizer runtime
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html app.js inference-worker.js PCMPlayerWorklet.js EventEmitter.js main-thread-worker-shim.js buffer-adaptation.js style.css favicon.svg dist/
          echo '' > dist/.nojekyll
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            "https://raw.githubusercontent.com/hemanth/pocket-voice/a4496c429f1dcd6ea8faef55a21dc4b7d45636a9/sentencepiece.js" \
            --output dist/sentencepiece.js
          test "$(wc -c < dist/sentencepiece.js)" -gt 3000000
          node scripts/test-buffer-adaptation.mjs
          node --check app.js
          node --check inference-worker.js
          node --check main-thread-worker-shim.js
          node --check PCMPlayerWorklet.js
          echo "Tokenizer and browser scripts available."
      - name: Validate linked files and progressive playback UI
        run: |
          python3 scripts/verify-pocket-site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
