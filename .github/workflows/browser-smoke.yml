name: Voice cloning browser smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'voice-clone.js'
      - 'main.js'
      - 'helper.js'
      - 'index.html'
      - 'scripts/download_model.py'
      - 'scripts/browser-smoke.mjs'
      - '.github/workflows/browser-smoke.yml'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Install dependencies
        run: npm install --no-audit --no-fund && npm install --no-save --no-audit --no-fund playwright-core
      - name: Download model and prepare runtime
        run: |
          python -m pip install "huggingface_hub>=0.33,<2"
          python scripts/download_model.py
          find node_modules/onnxruntime-web/dist -maxdepth 1 \( -name 'ort-wasm*.wasm' -o -name 'ort-wasm*.mjs' \) -exec cp {} public/ \;
      - run: npm run build && npm run verify
      - name: Serve static website
        run: nohup python -m http.server 4173 -d dist > /tmp/voice-studio-server.log 2>&1 &
      - name: Run complete synthesis and cloning test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/browser-smoke.mjs
      - name: Report server errors
        if: failure()
        run: cat /tmp/voice-studio-server.log || true
